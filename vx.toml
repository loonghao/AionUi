[tools]
bun = "latest"
node = "latest"
just = "latest"

[settings]
# Automatically install missing tools when entering dev environment
auto_install = true
# Cache duration for version checks
cache_duration = "7d"

[scripts]
build = "npm run build"
build-deb = "npm run build-deb"
build-mac = "npm run build-mac"
"build-mac:arm64" = "npm run build-mac:arm64"
"build-mac:x64" = "npm run build-mac:x64"
build-win = "npm run build-win"
cli = "npm run cli"
dist = "npm run dist"
"dist:linux" = "npm run dist:linux"
"dist:mac" = "npm run dist:mac"
"dist:win" = "npm run dist:win"
format = "npm run format"
"format:check" = "npm run format:check"
lint = "npm run lint"
"lint:fix" = "npm run lint:fix"
make = "npm run make"
package = "npm run package"
postinstall = "npm run postinstall"
prepare = "npm run prepare"
resetpass = "npm run resetpass"
start = "npm run start"
test = "npm run test"
"test:contract" = "npm run test:contract"
"test:coverage" = "npm run test:coverage"
"test:integration" = "npm run test:integration"
"test:watch" = "npm run test:watch"
typecheck = "npx tsc --noEmit"
webui = "npm run webui"
"webui:prod" = "npm run webui:prod"
"webui:prod:remote" = "npm run webui:prod:remote"
"webui:remote" = "npm run webui:remote"
